<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MathMania</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="IMAGES/MathMania_Icon.png" sizes="192x192">
    <link rel="apple-touch-icon" href="IMAGES/MathMania_Icon.png">
    <meta name="theme-color" content="#000000">
    <link rel="stylesheet" href="CSS/styles.css">
    <script src="SRC/config.js"></script>
</head>

<body>
    <div id="binaryRain"></div>

    <div class="container">
        <div id="appVersion" style="position: fixed; bottom: 10px; right: 10px; color: #fff;">
            Versão: <span id="versionNumber"></span>
        </div>
        <h1>MathMania</h1>
        <script type="module">
            import { animate, stagger, splitText } from './anime.esm.js';

            const { chars } = splitText('h1', { words: false, chars: true });

            animate(chars, {
                translateY: [
                    { to: -40, duration: 500, ease: 'outExpo' },
                    { to: 0, duration: 700, ease: 'outBounce' }
                ],
                scale: [
                    { to: 2, duration: 400 },
                    { to: 1, duration: 500 }
                ],
                delay: stagger(120),
                loop: false
            });

            animate(chars, {
                scale: [
                    { to: 1.25, duration: 400 },
                    { to: 1, duration: 500 }
                ],
                delay: stagger(120),
                loop: true
            });

            const buttons = document.querySelectorAll(
                '.buttons-group button'
            );

            // Entrada dos botões
            animate(buttons, {
                opacity: [0, 1],
                scale: [0.7, 1],
                y: [30, 0],
                delay: stagger(200),
                duration: 600,
                ease: 'outBack'
            });

            const binaryRain = document.getElementById('binaryRain');

            function createBinary() {

                const number = document.createElement('span');

                // 0 ou 1
                number.textContent = Math.random() > 0.5 ? '1' : '0';

                // Posição horizontal aleatória
                number.style.left = `${Math.random() * 100}%`;

                // Tamanho aleatório
                number.style.fontSize = `${14 + Math.random() * 20}px`;

                binaryRain.appendChild(number);

                setInterval(() => {
                    number.textContent = number.textContent === '0' ? '1' : '0';
                }, 100 + Math.random() * 500);

                animate(number, {
                    translateY: window.innerHeight + 100,

                    opacity: [
                        { to: 0, duration: 0 },
                        { to: 0.5, duration: 300 },
                        { to: 0.5, duration: 1500 },
                        { to: 0, duration: 500 }
                    ],

                    duration: 3000 + Math.random() * 2000,
                    ease: 'linear',

                    onComplete: () => {
                        number.remove();
                    }
                });
            }

            setInterval(createBinary, 150);



        </script>
        <div class="buttons-group">
            <button id="startButton" onclick="wherego()">Start</button>
            <script>
                function wherego() {
                    let maior = parseInt(localStorage.getItem("maxCheckpoint")) || 0;
                    if (maior > 0) {
                        window.location.href = 'HTML/escolha.html'
                    }
                    else{
                        window.location.href='HTML/iniciar.html'
                    }
                }
            </script>
            <button id="indexButton" onclick="window.location.href='HTML/indice.html'">📗</button>
            <button id="optionsButton" onclick="window.location.href='HTML/opcoes.html'">⚙️</button>
            <button id="achievementsButton" onclick="window.location.href='HTML/achievements.html'">🏆</button>
        </div>
        <button id="btnSobre" onclick="irParaSobre()">sobre</button>
        <script>
            function irParaSobre() {
                window.location.href = "HTML/sobre.html";
            }
        </script>
    </div>

    <script>
        // Exibe a versão do app
        document.getElementById('versionNumber').textContent = APP_VERSION;

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistration().then(reg => {
                if (reg) {
                    reg.update(); // força buscar a versão mais recente do SW
                    console.log("Tentando atualizar o Service Worker...");
                }
            });
        }
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js', { scope: './' })
                    .then(reg => console.log('Service Worker registrado!', reg))
                    .catch(err => console.log('Falha no registro do SW', err));
            });
        }
    </script>
</body>


</html>
