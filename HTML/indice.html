<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Índice</title>
    <link rel="manifest" href="../manifest.json">
    <link rel="stylesheet" href="../CSS/styles.css">
    <link rel="icon" href="../IMAGES/MathMania_Icon.png" sizes="192x192">
    <link rel="apple-touch-icon" href="../IMAGES/MathMania_Icon.png">
</head>

<body class="index-page">
    <div id="binaryRain"></div>
    <h1>Índice de Operadores</h1>

    <div class="collection-progress" style="color: white;">
        0 / 10 operadores descobertos
    </div>

    <div class="cards-grid" id="cards"></div>
    <br>
    <button onclick="voltar()">Voltar</button>

    <script src="../SRC/operadores.js" defer></script>
    <script>
        function voltar() {
            window.location.href = "../index.html";
        }
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('../service-worker.js', { scope: './' })
                    .then(reg => console.log('Service Worker registrado!', reg))
                    .catch(err => console.log('Falha no registro do SW', err));
            });
        }
    </script>
    <script type="module">
            import { animate, stagger, splitText } from '../anime.esm.js';
            const binaryRain = document.getElementById('binaryRain');

            function createBinary() {

                const number = document.createElement('span');

                // 0 ou 1
                number.textContent = Math.random() > 0.5 ? '1' : '0';

                // Posição horizontal aleatória
                number.style.left = `${Math.random() * 100}%`;

                // Tamanho aleatório
                number.style.fontSize = `${14 + Math.random() * 20}px`;

                binaryRain.appendChild(number);

                setInterval(() => {
                    number.textContent = number.textContent === '0' ? '1' : '0';
                }, 100 + Math.random() * 500);

                animate(number, {
                    translateY: window.innerHeight + 100,

                    opacity: [
                        { to: 0, duration: 0 },
                        { to: 0.5, duration: 300 },
                        { to: 0.5, duration: 1500 },
                        { to: 0, duration: 500 }
                    ],

                    duration: 3000 + Math.random() * 2000,
                    ease: 'linear',

                    onComplete: () => {
                        number.remove();
                    }
                });
            }

            setInterval(createBinary, 150);
        </script>
</body>

</html>
